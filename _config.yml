title: Лекции
description: Радиоматериалы • Электроника • ОТЦ

# Подключаем Minima через remote_theme с фиксацией коммита
remote_theme: jekyll/minima@1e8a445

# Плагины (jekyll-remote-theme обязателен для remote_theme)
plugins:
  - jekyll-remote-theme

# Настройки Minima
minima:
  skin: auto  # автоматическая тёмная/светлая тема
  date_format: "%d.%m.%Y"
  nav_pages:
    - index.md

# Исключаем manifest.json из обработки Jekyll (чтобы не пытался его парсить)
exclude:
  - "*/manifest.json"
  - Gemfile
  - Gemfile.lock
