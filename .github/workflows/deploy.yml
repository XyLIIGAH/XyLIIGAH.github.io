name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lecture index
        run: python3 scripts/generate-index.py || node scripts/generate-index.mjs
      - name: Prepare site
        run: |
          mkdir -p _site/css _site/js _site/lectures
          cp index.html lectures.json .nojekyll _site/
          cp css/style.css _site/css/
          cp js/app.js _site/js/
          cp -R lectures _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
